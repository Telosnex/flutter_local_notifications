name: Unit

on:
  pull_request:
    branches: [master]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on the default branch.
    branches: [master, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - uses: Telosnex/telosnex_ci_tools/actions/lint@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: flutter_local_notifications_linux
      - run: flutter pub get
        working-directory: flutter_local_notifications_linux/example
      # Only the package this CI tests: the monorepo has other packages. Run
      # in the package, so dart format reads its language version.
      - run: git ls-files '*.dart' | xargs dart format --output=none --set-exit-if-changed
        working-directory: flutter_local_notifications_linux
      - run: flutter analyze --fatal-infos
        working-directory: flutter_local_notifications_linux
      - run: flutter test -r expanded
        working-directory: flutter_local_notifications_linux
